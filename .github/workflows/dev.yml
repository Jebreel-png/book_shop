name: Dev Pipeline (Artifact-First)

on:
  push:
    branches:
      - dev

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.set-name.outputs.name }}
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Package the Application
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .

      - name: Set Artifact Name Output
        id: set-name
        run: echo "name=app-${{ github.sha }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Commit Artifact back to dev branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Save dev artifact app-${{ github.sha }}.tar.gz"
          file_pattern: 'artifacts/*.tar.gz'

  deploy-to-dev-server:
    needs: build-and-commit
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi

            rm -rf ~/dev-app && mkdir -p ~/dev-app
            cd ~/dev-app

            git init
            git remote add origin https://github.com/Jebreel-png/book_shop.git
            git fetch --depth=1 origin dev
            git checkout origin/dev -- artifacts/${{ needs.build-and-commit.outputs.artifact_name }} Dockerfile

            sudo docker stop book-shop-dev || true
            sudo docker rm book-shop-dev || true

            sudo docker build --build-arg ARTIFACT_FILE=artifacts/${{ needs.build-and-commit.outputs.artifact_name }} -t book-shop-image:dev .

            sudo docker run -d \
              --name book-shop-dev \
              -p 8081:8000 \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              book-shop-image:dev
