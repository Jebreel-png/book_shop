name: Dev Pipeline (Artifact-First)

on:
  push:
    branches:
      - dev

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.set-name.outputs.name }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Package the Application
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts .

      - name: Set Artifact Name Output
        id: set-name
        run: echo "name=app-${{ github.sha }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-app-artifact
          path: artifacts/

  deploy-to-dev-server:
    needs: build-and-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Deploy to EC2 Dev Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf ~/dev-app && mkdir -p ~/dev-app
            cd ~/dev-app
            git init
            git remote add origin https://github.com/${{ github.repository }}.git
            git fetch --depth=1 origin dev
            git checkout origin/dev -- artifacts/${{ needs.build-and-commit.outputs.artifact_name }}
            sudo docker stop book-shop-dev || true
            sudo docker rm book-shop-dev || true
            sudo docker build --build-arg ARTIFACT_FILE=artifacts/${{ needs.build-and-commit.outputs.artifact_name }} -t book-shop-image:dev .
            sudo docker run -d \
              --name book-shop-dev \
              -p 8081:8000 \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              book-shop-image:dev
