name: Prod Pipeline (Multi-Stage Production)

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

     
      - name: Package Application Artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .

      
      - name: Copy Files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "artifacts/app-${{ github.sha }}.tar.gz,Dockerfile"
          target: "~/test-app"
          strip_components: 0

      
      - name: Deploy and Verify on Test Server Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/test-app

            # Clean up old test environment remnants
            sudo docker stop book-shop-test || true
            sudo docker rm book-shop-test || true

            # Build locally on test port using the securely transferred artifact
            sudo docker build --build-arg ARTIFACT_FILE=artifacts/app-${{ github.sha }}.tar.gz -t book-shop-image:test .

            # Run container live on Test Port 8082 with the temporary testing database flag
            sudo docker run -d \
              --name book-shop-test \
              -p 8082:8000 \
              -e TESTING_ENV="True" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              book-shop-image:test

            # Heartbeat health check verification loop
            echo "Waiting for Django to initialize..."
            sleep 10

            for i in {1..5}; do
              if curl -s -f http://localhost:8082 > /dev/null; then
                echo "Health check passed! Application is live."
                exit 0
              fi
              echo "Server still waking up, retrying in 3 seconds..."
              sleep 3
            done

            curl -f http://localhost:8082 || exit 1

  build-and-push-registry:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create local temporary artifact to build registry image
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .

      - name: Log into Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push verified image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: ARTIFACT_FILE=artifacts/app-${{ github.sha }}.tar.gz
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }}

  deploy-to-production:
    needs: build-and-push-registry
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Production Image from Registry via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop book-shop-prod || true
            sudo docker rm book-shop-prod || true

            # Pull the fresh, pre-verified image from your registry hub
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:latest

            # Spin up the finalized Production App live on Web Port 80!
            sudo docker run -d \
              --name book-shop-prod \
              -p 80:8000 \
              --restart unless-stopped \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:latest
