name: Prod Pipeline (Multi-Stage Production)

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # 1. Package it up just like dev did to keep it artifact-first
      - name: Package Application Artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .

      # 2. Log into EC2 and run verification tests on Port 8082
      - name: Deploy and Verify on Test Server Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf ~/test-app && mkdir -p ~/test-app
            cd ~/test-app

            # Pull artifact
            git init
            git remote add origin https://github.com/Jebreel-png/book_shop.git
            git fetch --depth=1 origin main
            git checkout origin/main -- Dockerfile

            # Clean up old test environment remnants
            sudo docker stop book-shop-test || true
            sudo docker rm book-shop-test || true

            # Pass the freshly zipped artifact through git to build locally on test port
            git checkout origin/main -- artifacts/app-${{ github.sha }}.tar.gz || true
            sudo docker build --build-arg ARTIFACT_FILE=artifacts/app-${{ github.sha }}.tar.gz -t book-shop-image:test .

            # Run container live on Test Port 8082
            sudo docker run -d \
              --name book-shop-test \
              -p 8082:8000 \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              book-shop-image:test

            # Simple curl heartbeat check to verify the app actually boots up properly
            sleep 5
            curl -f http://localhost:8082 || exit 1

  build-and-push-registry:
    needs: run-tests  # Crucial! If tests fail above, the pipeline stops immediately.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create local temporary artifact to build registry image
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz --exclude=artifacts --exclude=.git .

      - name: Log into Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push verified image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: ARTIFACT_FILE=artifacts/app-${{ github.sha }}.tar.gz
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }}

  deploy-to-production:
    needs: build-and-push-registry
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Production Image from Registry via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clean up old running production elements
            sudo docker stop book-shop-prod || true
            sudo docker rm book-shop-prod || true

            # Pull the completely fresh, pre-verified image from your registry hub
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:latest

            # Spin up the finalized Production App live on Web Port 80!
            sudo docker run -d \
              --name book-shop-prod \
              -p 80:8000 \
              --restart unless-stopped \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:latest
