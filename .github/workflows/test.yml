name: Test Branch Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

     
      - name: Create Temporary Test Directory
        run: |
          mkdir -p .test
          mkdir -p artifacts

     
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: bookstore-app-artifact
          path: .test/

      
      - name: Extract Artifact Elements
        run: |
          cd .test
          tar -xzf *.tar.gz || unzip *.zip
          ls -la  # Verifies the source files are now sitting in .test/

      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      
      - name: Build and Push Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            ARTIFACT_PATH=.test/
          push: true
          tags: moath8527/book-shop:test
