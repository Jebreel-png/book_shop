name: Test Branch Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create the clean .test directory structure
      - name: Create Temporary Test Directory
        run: |
          mkdir -p .test
          mkdir -p artifacts

      # 2. Download the artifact generated by your dev pipeline
      # (This satisfies the "Image-first pipeline from artifact" rule)
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: bookstore-app-artifact
          path: .test/

      # 3. Extract the artifact inside the .test folder
      - name: Extract Artifact Elements
        run: |
          cd .test
          tar -xzf *.tar.gz || unzip *.zip
          ls -la  # Verifies the source files are now sitting in .test/

      # 4. Log in to your Docker Hub Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the image FROM the extracted artifact files
      - name: Build and Push Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            ARTIFACT_PATH=.test/
          push: true
          tags: moath8527/book-shop:test
