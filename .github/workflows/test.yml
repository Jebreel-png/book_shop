name: Test Branch Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create a clean sandbox directory structure
      - name: Create Temporary Test Directory
        run: |
          mkdir -p .test
          mkdir -p artifacts

      # 2. Grab the compiled source package from your DEV branch history run
      - name: Download Dev Build Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: dev.yml
          branch: dev
          name: bookstore-app-artifact
          path: .test/
          search_artifacts: true

      # 3. Extract and safely move the project to the root of .test
      - name: Extract Artifact Elements
        run: |
          cd .test
          
          # Unpack ALL archives safely
          for f in *.tar.gz; do tar -xzf "$f" || true; done
          
          # Move the project files up ONE level cleanly without destroying Django's inner folders
          cp -r */* . 2>/dev/null || true
          
          cd ..
          
          # CRITICAL STEP: Copy the Dockerfile directly into the build workspace
          cp Dockerfile .test/Dockerfile
          
          # Let's verify everything is side-by-side
          echo "=== VERIFYING FILES INSIDE .TEST SANDBOX ==="
          ls -la .test

      # 4. Log in to your Docker Hub Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the image completely isolated inside the .test folder
      - name: Build and Push Test Image
        uses: docker/build-push-action@v5
        with:
          context: .test
          file: .test/Dockerfile
          build-args: |
            ARTIFACT_PATH=.
          push: true
          tags: moath8527/book-shop:test
