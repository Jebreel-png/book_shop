name: Test Branch Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create the clean .test directory structure
      - name: Create Temporary Test Directory
        run: |
          mkdir -p .test
          mkdir -p artifacts

# 2. Grab the compiled source package from your DEV branch history run
      - name: Download Dev Build Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: dev.yml
          branch: dev
          name: bookstore-app-artifact
          path: .test/
          search_artifacts: true

# 3. Extract the artifact contents inside the .test folder cleanly
      - name: Extract Artifact Elements
        run: |
          cd .test
          # 1. Unpack whatever archive structure is sitting here
          tar -xzf *.tar.gz || tar -xzf */*.tar.gz || unzip *.zip || true
          
          # 2. Flatten any accidental nested folder structures
          if [ -d "artifacts" ]; then mv artifacts/* . 2>/dev/null || true; fi
          if ls -d */ | grep -v 'venv' >/dev/null 2>&1; then mv */* . 2>/dev/null || true; fi
          
          # 3. Verify requirements.txt is directly at the root of .test/
          ls -la

      # 4. Log in to your Docker Hub Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# # 5. Build the image FROM the extracted artifact files
      - name: Build and Push Test Image
        uses: docker/build-push-action@v5
        with:
          context: .test
          file: ./Dockerfile
          push: true
          tags: moath8527/book-shop:test
