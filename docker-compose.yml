version: '3.8'

services:
  
  db:
    image: postgres:15-alpine
    container_name: book-shop-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_secure_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookshop-network

  
  book-shop-dev:
    image: moath8527/book-shop:dev
    container_name: book-shop-dev
    restart: unless-stopped
    ports:
      - "8081:8000"
    environment:
      - POSTGRES_PASSWORD=your_secure_db_password
    depends_on:
      - db
    networks:
      - bookshop-network

  
  book-shop-test:
    image: moath8527/book-shop:test
    container_name: book-shop-test
    restart: unless-stopped
    ports:
      - "8082:8000"
    environment:
      - POSTGRES_PASSWORD=your_secure_db_password
    depends_on:
      - db
    networks:
      - bookshop-network

  
  book-shop-prod:
    image: moath8527/book-shop:latest
    container_name: book-shop-prod
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - POSTGRES_PASSWORD=your_secure_db_password
    depends_on:
      - db
    networks:
      - bookshop-network

volumes:
  postgres_data:

networks:
  bookshop-network:
    driver: bridge
